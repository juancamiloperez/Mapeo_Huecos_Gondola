<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Control de Agotados OSA</title>

<!-- Hace que la app se abra sin barra de navegador al agregarla a la pantalla de inicio -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10233d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agotados OSA">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#10233d;
    --navy-2:#16324f;
    --paper:#f3efe6;
    --card:#ffffff;
    --tag-red:#c8382a;
    --tag-red-dark:#9c2a20;
    --amber:#d9932c;
    --green:#2f7d5a;
    --ink:#1c2b3a;
    --muted:#6b7a8d;
    --line:#e3ddd0;
    --radius:10px;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#c9c2b0;border-radius:4px;}

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 20% 20%, var(--navy-2), var(--navy) 65%);
    padding:24px;
  }
  .login-card{
    background:var(--card); width:100%; max-width:360px; border-radius:16px;
    padding:32px 28px; box-shadow:0 20px 50px rgba(0,0,0,.35); position:relative; overflow:hidden;
  }
  .login-card::before{
    content:"AGOTADO"; position:absolute; top:14px; right:-38px; background:var(--tag-red);
    color:#fff; font-weight:800; font-size:11px; letter-spacing:2px; padding:5px 44px;
    transform:rotate(35deg); box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .brand{font-size:13px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:2px;}
  .brand-title{font-size:24px; font-weight:800; color:var(--navy); margin:0 0 22px 0;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:15px;
    background:#fbfaf7;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--navy-2); border-color:var(--navy-2);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--navy); color:#fff; border:none; padding:12px 18px; border-radius:8px;
    font-size:15px; font-weight:700; cursor:pointer; width:100%; transition:transform .08s, background .15s;
  }
  .btn:hover{background:var(--navy-2);}
  .btn:active{transform:scale(.98);}
  .btn.red{background:var(--tag-red);} .btn.red:hover{background:var(--tag-red-dark);}
  .btn.green{background:var(--green);}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--navy);}
  .btn.small{padding:8px 12px; font-size:13px; width:auto;}
  .error-msg{color:var(--tag-red); font-size:13px; margin-top:10px; min-height:16px;}
  .login-hint{font-size:11.5px; color:var(--muted); margin-top:18px; line-height:1.5;}

  /* ---------- Shell ---------- */
  #appShell{display:none; min-height:100vh; flex-direction:column;}
  header.topbar{
    background:var(--navy); color:#fff; padding:12px 16px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .topbar-title{font-weight:800; font-size:16px; letter-spacing:.3px; margin-right:auto; display:flex; align-items:center; gap:8px;}
  .tag-chip{background:var(--tag-red); font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px; letter-spacing:1px;}
  .pdv-select{
    background:var(--navy-2); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:6px;
    padding:7px 10px; font-size:13px; font-weight:600;
  }
  .user-chip{font-size:12px; color:#cfe0ef; display:flex; align-items:center; gap:8px;}
  .logout-link{color:#f6c6be; cursor:pointer; font-size:12px; text-decoration:underline;}

  nav.tabs{
    display:flex; background:var(--navy-2); overflow-x:auto; position:sticky; top:52px; z-index:19;
  }
  nav.tabs button{
    background:none; border:none; color:#cfe0ef; padding:13px 16px; font-size:13.5px; font-weight:700;
    cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent;
  }
  nav.tabs button.active{color:#fff; border-bottom-color:var(--tag-red);}

  main{flex:1; padding:16px; max-width:960px; margin:0 auto; width:100%;}
  .card{background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid var(--line);}
  .card h2{margin:0 0 14px 0; font-size:16px; color:var(--navy);}
  .card h3{margin:0 0 10px 0; font-size:14px; color:var(--navy);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:600px){.grid2{grid-template-columns:1fr;}}
  .readonly-box{
    background:#f5f2ea; border:1px dashed var(--line); border-radius:8px; padding:10px 12px; font-size:14px;
  }
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:800; letter-spacing:.3px;}
  .badge.real{background:#fde6e2; color:var(--tag-red-dark);}
  .badge.falso{background:#e6f2ea; color:var(--green);}
  .badge.pend{background:#fdf1dd; color:#8a5c10;}
  .badge.cerrado{background:#e6f2ea; color:var(--green);}
  .badge.proceso{background:#e3ecf7; color:#2b568f;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  th{color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px;}
  tr:hover td{background:#faf8f3;}

  #scanBox{width:100%; max-width:360px; max-height:220px; margin:0 auto; border-radius:10px; overflow:hidden; border:2px solid var(--navy); position:relative;}
  #scanBox video, #scanBox canvas{width:100% !important; height:220px !important; object-fit:cover; display:block;}
  .scan-line{
    position:absolute; left:6%; right:6%; height:3px; top:8%;
    background:linear-gradient(90deg, transparent, var(--tag-red) 20%, var(--tag-red) 80%, transparent);
    box-shadow:0 0 10px 1px var(--tag-red);
    display:none; z-index:5; pointer-events:none;
  }
  .scan-line.active{ display:block; animation: scanMove 1.7s ease-in-out infinite; }
  @keyframes scanMove{
    0%{ top:8%; }
    50%{ top:86%; }
    100%{ top:8%; }
  }
  .video-placeholder{
    background:#eee; border-radius:10px; padding:34px 12px; text-align:center; color:var(--muted); font-size:13px;
  }
  .kpi-tile{
    background:linear-gradient(135deg, var(--navy), var(--navy-2)); color:#fff; border-radius:12px; padding:18px;
    text-align:center;
  }
  .kpi-tile .val{font-size:34px; font-weight:800;}
  .kpi-tile .lbl{font-size:12px; opacity:.85; letter-spacing:.5px; text-transform:uppercase; margin-top:4px;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
    padding:11px 18px; border-radius:8px; font-size:13.5px; z-index:100; box-shadow:0 6px 20px rgba(0,0,0,.3);
    display:none;
  }
  .toast.show{display:block;}
  .toast.err{background:var(--tag-red);}
  .flex-between{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .muted{color:var(--muted); font-size:12.5px;}
  canvas{max-width:100%;}
  .loading{opacity:.55; pointer-events:none;}
  .photo-preview{max-width:160px; border-radius:8px; border:1px solid var(--line); margin-top:8px; display:block;}
  select, input[type=text], input[type=file], input[type=password]{font-family:inherit;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand">Control de disponibilidad</div>
    <p class="brand-title">Agotados en Góndola · OSA</p>
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="usuario">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn red" onclick="doLogin()">Ingresar</button>
    <div class="error-msg" id="loginError"></div>
    <div class="login-hint">Acceso restringido. Cada inicio de sesión queda asociado a los registros de agotados para trazabilidad.</div>
    <div style="margin-top:14px; background:#fef3c7; border:2px solid #d9932c; border-radius:8px; padding:8px 10px; text-align:center; font-weight:800; color:#8a5c10; font-size:13px;">VERSIÓN ESCÁNER: v5-Foto+ZXing</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appShell">
  <header class="topbar">
    <div class="topbar-title">Agotados OSA <span class="tag-chip">EN VIVO</span></div>
    <select class="pdv-select" id="pdvSelect" onchange="onPdvChange()"></select>
    <div class="user-chip">
      <span id="userLabel"></span> · <span class="logout-link" onclick="logout()">Salir</span>
    </div>
  </header>

  <nav class="tabs" id="tabsNav"></nav>

  <main id="mainContent"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== CAPTURADOR DE ERRORES (para diagnosticar en el celular) ===================== */
// Muestra cualquier error de JavaScript como una alerta en pantalla. Esto es
// temporal, solo para depurar el escáner en dispositivos sin acceso a la
// consola del navegador (ej. iPhone sin Mac cerca). Se puede quitar después.
window.addEventListener('error', function(e){
  alert('⚠️ Error JS: ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e){
  const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  alert('⚠️ Error de promesa: ' + msg);
});

/* ===================== ESTADO ===================== */
const state = {
  usuario: null, nombre: null, rol: null,
  pdv: null,
  vista: null,
  motivos: [],
  scanner: null,          // no usado actualmente (se deja por compatibilidad)
  quaggaActivo: false,    // true mientras Quagga2 (respaldo) está corriendo
  quaggaBuffer: [],       // últimas lecturas, para exigir 3 coincidencias seguidas antes de aceptar
  scannerActivo: false,   // true mientras el lector nativo está corriendo
  bdStream: null,         // stream de cámara del lector nativo
  bdRafId: null,          // id del requestAnimationFrame del lector nativo
  ultimoProducto: null,
  fotoBase64: null,
  fotoMime: null,
  charts: {}
};

function storageGet(k){ try{ return localStorage.getItem(k); }catch(e){ return state['_'+k] || null; } }
function storageSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ state['_'+k]=v; } }
function storageDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete state['_'+k]; } }

/* ===================== CONEXIÓN A LA API (Apps Script) ===================== */
// 1. Publica Code.gs como app web en Apps Script (Implementar > Nueva implementación).
// 2. Pega aquí la URL que termina en /exec.
const API_URL = 'PEGA_AQUI_TU_URL_/exec';

function callApi(action, params){
  return fetch(API_URL, {
    method: 'POST',
    // text/plain evita el preflight CORS que Apps Script no maneja (doOptions)
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, params: params || {} })
  }).then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

/* ===================== TOAST ===================== */
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.className='toast', 3200);
}

/* ===================== LOGIN / SESIÓN ===================== */
function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  if(!u || !p){ errBox.textContent = 'Ingresa usuario y contraseña.'; return; }
  document.querySelector('.login-card').classList.add('loading');
  callApi('login', { usuario: u, password: p })
    .then(res => {
      document.querySelector('.login-card').classList.remove('loading');
      if(!res.ok){ errBox.textContent = res.mensaje || 'No fue posible iniciar sesión.'; return; }
      state.usuario = res.usuario; state.nombre = res.nombre; state.rol = res.rol;
      storageSet('sesion', JSON.stringify(res));
      iniciarApp();
    })
    .catch(err => {
      document.querySelector('.login-card').classList.remove('loading');
      errBox.textContent = 'Error de conexión: ' + err.message;
    });
}

function logout(){
  storageDel('sesion');
  location.reload();
}

function checkSesionPrevia(){
  const raw = storageGet('sesion');
  if(!raw) return;
  try{
    const res = JSON.parse(raw);
    if(res && res.ok){
      state.usuario = res.usuario; state.nombre = res.nombre; state.rol = res.rol;
      iniciarApp();
    }
  }catch(e){}
}

/* ===================== INICIO APP ===================== */
function iniciarApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  document.getElementById('userLabel').textContent = state.nombre + ' (' + state.rol + ')';

  callApi('getMotivos', {}).then(m => state.motivos = m).catch(err => toast('Error cargando motivos: ' + err.message, true));

  callApi('getPuntosVenta', {}).then(pdvs => {
    const sel = document.getElementById('pdvSelect');
    sel.innerHTML = pdvs.map(p => `<option value="${p}">${p}</option>`).join('');
    state.pdv = storageGet('pdv') || pdvs[0];
    sel.value = state.pdv;
    construirTabs(); // solo se dibujan las pestañas cuando ya hay un punto de venta válido
  }).catch(err => toast('Error cargando puntos de venta: ' + err.message, true));
}

function onPdvChange(){
  state.pdv = document.getElementById('pdvSelect').value;
  storageSet('pdv', state.pdv);
  if(state.vista) render(state.vista);
}

/* ===================== TABS SEGÚN ROL ===================== */
function construirTabs(){
  const tabs = [];
  if(state.rol === 'Operativo' || state.rol === 'Admin') tabs.push({id:'registro', label:'Registro de Agotados'});
  if(state.rol === 'Comprador' || state.rol === 'Admin') tabs.push({id:'analisis', label:'Análisis Agotados'});
  if(state.rol === 'Comprador' || state.rol === 'Admin') tabs.push({id:'importar', label:'Importar Inventario'});
  tabs.push({id:'tablero', label:'Tablero'});
  tabs.push({id:'kpis', label:'KPIs'});

  const nav = document.getElementById('tabsNav');
  nav.innerHTML = tabs.map(t => `<button id="tab_${t.id}" onclick="render('${t.id}')">${t.label}</button>`).join('');
  render(tabs[0].id);
}

function marcarTabActiva(id){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tab_' + id);
  if(el) el.classList.add('active');
}

function render(vista){
  state.vista = vista;
  marcarTabActiva(vista);
  if(vista === 'registro') renderRegistro();
  else if(vista === 'analisis') renderAnalisis();
  else if(vista === 'importar') renderImportar();
  else if(vista === 'tablero') renderTablero();
  else if(vista === 'kpis') renderKPIs();
}

/* ===================== 1. REGISTRO DE AGOTADOS (OPERATIVO) ===================== */
function renderRegistro(){
  const main = document.getElementById('mainContent');
  const ahora = new Date().toLocaleString('es-CO');
  main.innerHTML = `
    <div class="card">
      <h2>Registro de agotados</h2>
      <div class="grid2">
        <div class="readonly-box"><strong>Fecha y hora</strong><br>${ahora}</div>
        <div class="readonly-box"><strong>Punto de venta</strong><br>${state.pdv}</div>
      </div>

      <h3 style="margin-top:18px;">Escanear código del hablador</h3>

      <div class="readonly-box" style="border-color:var(--navy); background:#eef4f8;">
        <strong>📷 Opción recomendada en iPhone: toma una foto nítida del código</strong>
        <p class="muted" style="margin:6px 0 8px 0;">Más confiable que la cámara en vivo: usa el enfoque y flash reales de tu cámara.</p>
        <input type="file" accept="image/*" capture="environment" id="fotoCodigoInput" onchange="leerCodigoDesdeFoto(event)">
        <div id="fotoCodigoEstado" class="muted" style="margin-top:8px;"></div>
      </div>

      <details style="margin-top:14px;">
        <summary style="cursor:pointer; font-weight:700; color:var(--navy); font-size:13.5px;">O usar cámara en vivo (experimental)</summary>
        <div id="scanBox" style="margin-top:10px;">
          <div id="qr-reader" style="width:100%;"></div>
          <div class="scan-line" id="scanLine"></div>
        </div>
        <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
          <button class="btn small ghost" onclick="iniciarScanner()">Activar cámara</button>
          <button class="btn small ghost" onclick="detenerScanner()">Detener cámara</button>
        </div>
        <p class="muted" style="margin-top:8px;">Sostén el celular horizontal, a unos 10-15 cm del hablador, con buena luz y el código bien plano (sin arrugas ni reflejos).</p>
        <div id="motorScannerLabel" style="margin-top:6px; font-size:12px; font-weight:700; color:var(--navy);"></div>
      </details>

      <div class="field" style="margin-top:14px;">
        <label>Buscar producto (código de barras, código interno, descripción y/o categoría)</label>
        <div class="grid2">
          <input type="text" id="busquedaTexto" placeholder="Escribe un código o palabra de la descripción...">
          <select id="filtroCategoria"><option value="Todas">Todas las categorías</option></select>
        </div>
        <button class="btn small" style="width:auto; margin-top:8px;" onclick="buscarPorFiltro()">Buscar</button>
        <div id="resultadosFiltro" style="margin-top:10px;"></div>
      </div>

      <div id="productoInfo" style="margin-top:16px;"></div>

      <div class="field" style="margin-top:14px; display:none;" id="ubicacionField">
        <label>Ubicación donde encontró el agotado</label>
        <input type="text" id="ubicacionManual" placeholder="Ej: Pasillo 3, estante inferior">
      </div>

      <div class="field" style="margin-top:14px; display:none;" id="fotoField">
        <label>Foto de evidencia (góndola vacía)</label>
        <input type="file" accept="image/*" capture="environment" id="fotoInput" onchange="onFotoSeleccionada(event)">
        <img id="fotoPreview" class="photo-preview" style="display:none;">
      </div>

      <button class="btn red" id="btnGuardarAgotado" style="margin-top:16px; display:none;" onclick="guardarRegistro()">Guardar registro</button>
    </div>
  `;
  cargarCategoriasFiltro();
}

async function iniciarScanner(){
  if(state.scannerActivo || state.quaggaActivo){ toast('La cámara ya está activa.'); return; }
  document.getElementById('qr-reader').innerHTML = '<div class="muted" style="padding:20px; text-align:center;">Iniciando cámara…</div>';

  const usoNativo = await iniciarScannerNativo();
  if(usoNativo) return; // ya se encargó (con éxito o con su propio error)

  iniciarScannerQuagga();
}

/**
 * Lector nativo del navegador (BarcodeDetector). Disponible en Chrome/Android
 * (y navegadores basados en Chromium); en general es más preciso que las
 * librerías en JavaScript puro porque usa el motor de cámara del sistema.
 * Devuelve true si este método se hizo cargo del escaneo (con o sin error),
 * y false si el navegador no lo soporta, para intentar el respaldo.
 */
async function iniciarScannerNativo(){
  if(!('BarcodeDetector' in window)) return false;

  try{
    let formatos;
    try{
      const soportados = await BarcodeDetector.getSupportedFormats();
      formatos = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'].filter(f => soportados.includes(f));
    }catch(e){ formatos = undefined; }

    const detector = new BarcodeDetector(formatos && formatos.length ? { formats: formatos } : undefined);

    document.getElementById('qr-reader').innerHTML = '';
    const video = document.createElement('video');
    video.setAttribute('playsinline', ''); video.setAttribute('autoplay', ''); video.muted = true;
    video.style.width = '100%'; video.style.borderRadius = '8px';
    document.getElementById('qr-reader').appendChild(video);

    state.bdStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = state.bdStream;
    await video.play();
    state.scannerActivo = true;
    toast('Lector nativo activo (Android/Chrome).');
    const lbl1 = document.getElementById('motorScannerLabel'); if(lbl1) lbl1.textContent = '🟢 Motor activo: lector nativo (Android/Chrome)';
    const linea1 = document.getElementById('scanLine'); if(linea1) linea1.classList.add('active');

    const tick = async () => {
      if(!state.scannerActivo) return;
      try{
        const codigos = await detector.detect(video);
        if(codigos.length){
          const valor = codigos[0].rawValue;
          document.getElementById('busquedaTexto').value = valor;
          buscarProductoPorCodigo(valor);
          detenerScanner();
          return;
        }
      }catch(e){ /* frame sin lectura válida, se sigue intentando */ }
      state.bdRafId = requestAnimationFrame(tick);
    };
    tick();
    return true;
  }catch(err){
    document.getElementById('qr-reader').innerHTML =
      '<div class="video-placeholder">No fue posible acceder a la cámara. Usa el campo manual de abajo.<br><span class="muted">' + err + '</span></div>';
    return true;
  }
}

/**
 * Respaldo con Quagga2, especializada en códigos de barras 1D (EAN, UPC,
 * Code128, Code39). Se usa en navegadores sin BarcodeDetector nativo,
 * como Safari/iPhone, donde la lectura de códigos 1D suele ser más difícil.
 * Exige 3 lecturas idénticas seguidas antes de aceptar el código, para
 * evitar falsos positivos (típico de esta técnica de decodificación).
 */
function iniciarScannerQuagga(){
  document.getElementById('qr-reader').innerHTML = '';
  toast('Lector alterno activo (compatibilidad iPhone/Safari).');
  const lbl2 = document.getElementById('motorScannerLabel'); if(lbl2) lbl2.textContent = '🟢 Motor activo: Quagga2 (respaldo iPhone/Safari) — v4';
  state.quaggaBuffer = [];

  Quagga.init({
    inputStream: {
      type: 'LiveStream',
      target: document.getElementById('qr-reader'),
      constraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    },
    locator: { patchSize: 'medium', halfSample: true },
    numOfWorkers: 2,
    frequency: 10,
    decoder: {
      readers: ['ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader', 'code_128_reader', 'code_39_reader']
    },
    locate: true
  }, function(err){
    if(err){
      document.getElementById('qr-reader').innerHTML =
        '<div class="video-placeholder">No fue posible acceder a la cámara. Usa el campo manual de abajo.<br><span class="muted">' + err + '</span></div>';
      return;
    }
    Quagga.start();
    state.quaggaActivo = true;
    const linea2 = document.getElementById('scanLine'); if(linea2) linea2.classList.add('active');
  });

  Quagga.onDetected(onQuaggaDetected);
}

function onQuaggaDetected(result){
  const code = result && result.codeResult && result.codeResult.code;
  if(!code) return;
  state.quaggaBuffer.push(code);
  if(state.quaggaBuffer.length > 4) state.quaggaBuffer.shift();
  const ultimas3 = state.quaggaBuffer.slice(-3);
  if(ultimas3.length === 3 && ultimas3.every(c => c === ultimas3[0])){
    document.getElementById('busquedaTexto').value = code;
    buscarProductoPorCodigo(code);
    detenerScanner();
  }
}

function detenerScanner(){
  state.scannerActivo = false;
  if(state.bdRafId){ cancelAnimationFrame(state.bdRafId); state.bdRafId = null; }
  if(state.bdStream){ state.bdStream.getTracks().forEach(t => t.stop()); state.bdStream = null; }
  if(state.quaggaActivo){
    try{ Quagga.offDetected(onQuaggaDetected); Quagga.stop(); }catch(e){}
    state.quaggaActivo = false;
  }
  const lbl = document.getElementById('motorScannerLabel'); if(lbl) lbl.textContent = '';
  const linea = document.getElementById('scanLine'); if(linea) linea.classList.remove('active');
}

/** Búsqueda única por código de barras, código interno, descripción y/o categoría. */
function buscarPorFiltro(){
  const texto = document.getElementById('busquedaTexto').value.trim();
  const categoria = document.getElementById('filtroCategoria').value;
  const cont = document.getElementById('resultadosFiltro');
  if(!texto && categoria === 'Todas'){
    toast('Escribe un código/descripción o elige una categoría para buscar.', true);
    return;
  }
  cont.innerHTML = '<div class="muted">Buscando…</div>';
  callApi('buscarProductoUnificado', { filtros: { tienda: state.pdv, texto, categoria } })
    .then(res => {
      if(!res.ok){ cont.innerHTML = '<div class="readonly-box">Error: ' + res.mensaje + '</div>'; return; }
      if(res.resultados.length === 0){ cont.innerHTML = '<div class="muted">No se encontraron productos con ese criterio.</div>'; return; }
      // si hay un único resultado exacto, se muestra directo (mismo comportamiento que escanear)
      if(res.resultados.length === 1){
        mostrarProductoEncontrado(res.resultados[0]);
        cont.innerHTML = '';
        return;
      }
      state.resultadosFiltroActuales = res.resultados;
      const nota = res.total > res.resultados.length ? `<div class="muted" style="margin-bottom:6px;">Mostrando ${res.resultados.length} de ${res.total} resultados — afina la búsqueda para ver menos.</div>` : '';
      cont.innerHTML = nota + res.resultados.map((p, i) => `
        <div class="readonly-box" style="margin-bottom:8px; cursor:pointer;" onclick="seleccionarResultadoFiltro(${i})">
          <div class="flex-between">
            <strong>${p.descripcion}</strong>
            <span class="badge ${p.tipoAgotado === 'Agotado Real' ? 'real' : 'falso'}">${p.tipoAgotado}</span>
          </div>
          <div class="muted" style="margin-top:4px;">Código: ${p.codigoInterno || '—'} · Barras: ${p.codigoBarra || '—'} · Categoría: ${p.categoria || '—'} · Stock PDV/B1/B2: ${p.stock}/${p.stockBodega1}/${p.stockBodega2}</div>
        </div>
      `).join('');
    })
    .catch(err => { cont.innerHTML = '<div class="readonly-box">Error: ' + err.message + '</div>'; });
}

function seleccionarResultadoFiltro(i){
  const p = state.resultadosFiltroActuales[i];

  mostrarProductoEncontrado(p);
  document.getElementById('resultadosFiltro').innerHTML = '';

/**
 * Decodifica un código de barras a partir de una foto fija (no video en vivo).
 * Usa la cámara nativa del celular (con su autoenfoque y flash reales) vía
 * <input type="file" capture="environment">, lo que en la práctica es mucho
 * más confiable que leer cuadros de video en vivo de baja resolución.
 */
async function leerCodigoDesdeFoto(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const estado = document.getElementById('fotoCodigoEstado');
  estado.textContent = 'Leyendo código…';
  const url = URL.createObjectURL(file);
  try{
    const reader = new ZXing.BrowserMultiFormatReader();
    const result = await reader.decodeFromImageUrl(url);
    const code = result.getText();
    document.getElementById('busquedaTexto').value = code;
    estado.textContent = '✅ Código leído: ' + code;
    buscarProductoPorCodigo(code);
  }catch(err){
    estado.textContent = '❌ No se pudo leer el código en esa foto. Intenta de nuevo: más luz, más cerca, código bien enfocado y sin reflejos — o ingrésalo manualmente abajo.';
  }finally{
    URL.revokeObjectURL(url);
    ev.target.value = ''; // permite volver a tomar foto del mismo archivo si hace falta
  }
}

function onFotoSeleccionada(ev){
  const file = ev.target.files[0];
  if(!file) return;
  state.fotoMime = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = e => {
    state.fotoBase64 = e.target.result;
    const prev = document.getElementById('fotoPreview');
    prev.src = e.target.result;
    prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

/**
 * Parsea el reporte crudo del ERP: viene como texto de ancho fijo dentro de
 * una sola columna, usando espacios "duros" (NBSP, \u00A0) tanto para
 * separar palabras dentro de un campo como para rellenar entre columnas.
 * Se asume que 2 o más NBSP seguidos son separador de columna, y 1 solo NBSP
 * es un espacio normal dentro del texto.
 */
function parsearReporteErp(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, { type: 'array' });
  const hoja = wb.Sheets[wb.SheetNames[0]];
  const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: false, defval: '' });
  const NBSP = '\u00A0';
  const reSeparador = new RegExp(NBSP + '{2,}');
  const registros = [];

  filas.forEach(fila => {
    const s = fila[0];
    if(!s || typeof s !== 'string') return;
    const limpio = s.trim();
    if(!limpio) return;

    const crudo = limpio.split(reSeparador);
    const partes = crudo.map(p => p.split(NBSP).join(' ').trim()).filter(p => p !== '');
    if(partes.length < 4) return;

    const tokens0 = partes[0].split(/\s+/);
    if(!tokens0.length || !/^\d+$/.test(tokens0[0])) return;

    const n = partes.length;
    const dep1 = parseFloat(partes[n-3]);
    const dep2 = parseFloat(partes[n-2]);
    const dep3 = parseFloat(partes[n-1]);
    if(isNaN(dep1) || isNaN(dep2) || isNaN(dep3)) return;

    const codigo = tokens0[0];
    const referencia = tokens0.length > 1 ? tokens0[1] : tokens0[0]; // se usará como código de barras (SKU_ID)
    const descripcion = n >= 5 ? partes[1] : partes.slice(1, n-3).join(' ');
    registros.push({ codigo, referencia, descripcion, dep1, dep2, dep3 });
  });

  return registros;
}

async function confirmarImportacion(){
  const registros = state.importarRegistros;
  if(!registros || !registros.length) return;

  const estado = document.getElementById('importarEstado');
  const wrap = document.getElementById('importarProgresoWrap');
  const barra = document.getElementById('importarProgresoBarra');
  const texto = document.getElementById('importarProgresoTexto');
  wrap.style.display = 'block';
  estado.innerHTML = '';

  const TAM_LOTE = 2000; // registros por solicitud, para no enviar todo de una vez
  let totalActualizados = 0, totalNuevos = 0;

  for(let i = 0; i < registros.length; i += TAM_LOTE){
    const lote = registros.slice(i, i + TAM_LOTE);
    const pct = Math.round((i / registros.length) * 100);
    barra.style.width = pct + '%';
    texto.textContent = `Importando… ${i.toLocaleString('es-CO')} / ${registros.length.toLocaleString('es-CO')} (${pct}%)`;

    try{
      const res = await callApi('importarInventario', { tienda: state.pdv, registros: lote });
      if(!res.ok){
        estado.innerHTML = `<div class="readonly-box" style="border-color:var(--tag-red); color:var(--tag-red-dark);">Se detuvo en el lote ${i}-${i+lote.length}: ${res.mensaje}</div>`;
        return;
      }
      totalActualizados += res.actualizados;
      totalNuevos += res.nuevos;
    }catch(err){
      estado.innerHTML = `<div class="readonly-box" style="border-color:var(--tag-red); color:var(--tag-red-dark);">Error de conexión en el lote ${i}-${i+lote.length}: ${err.message}</div>`;
      return;
    }
  }

  barra.style.width = '100%';
  texto.textContent = `Completado: ${registros.length.toLocaleString('es-CO')} / ${registros.length.toLocaleString('es-CO')} (100%)`;
  estado.innerHTML = `
    <div class="readonly-box" style="border-color:var(--green);">
      ✅ Importación completa para <strong>${state.pdv}</strong>: <strong>${totalActualizados}</strong> productos actualizados, <strong>${totalNuevos}</strong> nuevos (sin código de barras aún).
    </div>
  `;
  state.importarRegistros = null;
}

  main.innerHTML = `
    <div class="card">
      <div class="flex-between">
        <h2 style="margin:0;">Tablero de agotados</h2>
        <select id="filtroTiendaTablero" onchange="cargarTablero()">
          <option value="Todas">Todas las tiendas</option>
          ${['Golazo','Ayacucho','Oriental'].map(p=>`<option value="${p}">${p}</option>`).join('')}
        </select>
      </div>
      <div id="costoTile" class="grid2" style="margin-top:14px;"></div>
      <div class="grid2" style="margin-top:14px;">
        <div><h3>SKUs agotados por motivo</h3><canvas id="chartMotivo"></canvas></div>
        <div><h3>% participación por causal</h3><canvas id="chartCausal"></canvas></div>
        <div><h3>Agotados por punto de venta</h3><canvas id="chartPDV"></canvas></div>
        <div><h3>Agotados por área responsable</h3><canvas id="chartArea"></canvas></div>
        <div><h3>Falso vs. Real</h3><canvas id="chartTipo"></canvas></div>
        <div><h3>Estado de gestión</h3><canvas id="chartEstado"></canvas></div>
      </div>
      <div style="margin-top:8px;"><h3>Top SKUs con más agotados</h3><canvas id="chartTop"></canvas></div>
      <div style="margin-top:18px;"><h3>Top SKUs por costo estimado de agotados</h3><canvas id="chartTopCosto"></canvas></div>
    </div>
  `;
  cargarTablero();
}

function destruirCharts(){ Object.values(state.charts).forEach(c => c && c.destroy()); state.charts = {}; }

function cargarTablero(){
  const tienda = document.getElementById('filtroTiendaTablero').value;
  callApi('getDashboardData', { filtros: { tienda: tienda } })
    .then(d => {
      destruirCharts();
      document.getElementById('costoTile').innerHTML = `
        <div class="kpi-tile" style="background:linear-gradient(135deg,#2f7d5a,#1f5a3f);">
          <div class="val">${formatearMoneda(d.costoTotalAgotados)}</div>
          <div class="lbl">Costo estimado de agotados (costo unitario × venta/día)</div>
        </div>
        <div class="kpi-tile"><div class="val">${d.totalRegistros}</div><div class="lbl">Registros en el período filtrado</div></div>
      `;
      state.charts.motivo = barChart('chartMotivo', d.porCausal);
      state.charts.causal = pieChart('chartCausal', d.participacionCausal, true);
      state.charts.pdv = barChart('chartPDV', d.porTienda);
      state.charts.area = barChart('chartArea', d.porArea);
      state.charts.tipo = pieChart('chartTipo', d.porTipo, false);
      state.charts.estado = pieChart('chartEstado', d.porEstado, false);
      state.charts.top = barChart('chartTop', d.topSkus, true);
      state.charts.topCosto = barChart('chartTopCosto', d.topSkusPorCosto, true);
    })
    .catch(err => toast('Error tablero: ' + err.message, true));
}

const PALETA = ['#c8382a','#10233d','#d9932c','#2f7d5a','#2b568f','#8a5c10','#9c2a20','#6b7a8d'];

function barChart(canvasId, data, horizontal){
  const ctx = document.getElementById(canvasId);
  return new Chart(ctx, {
    type: 'bar',
    data: { labels: data.map(x=>x.label), datasets: [{ data: data.map(x=>x.valor), backgroundColor: PALETA }] },
    options: {
      indexAxis: horizontal ? 'y' : 'x',
      plugins: { legend: { display:false } },
      scales: { x:{ ticks:{ autoSkip:false } } }
    }
  });
}

function pieChart(canvasId, data, esPorcentaje){
  const ctx = document.getElementById(canvasId);
  return new Chart(ctx, {
    type: 'doughnut',
    data: { labels: data.map(x=>x.label), datasets: [{ data: data.map(x=> esPorcentaje ? x.porcentaje : x.valor), backgroundColor: PALETA }] },
    options: { plugins: { legend: { position:'bottom', labels:{ boxWidth:12, font:{size:10.5} } } } }
  });
}

/* ===================== 4. KPIs ===================== */
function renderKPIs(){
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="card">
      <div class="flex-between">
        <h2 style="margin:0;">KPI — Disponibilidad Real en Góndola (OSA)</h2>
        <select id="filtroTiendaKPI" onchange="cargarKPI()">
          <option value="Todas">Todas las tiendas</option>
          ${['Golazo','Ayacucho','Oriental'].map(p=>`<option value="${p}">${p}</option>`).join('')}
        </select>
      </div>
      <p class="muted">OSA = [1 − (SKUs agotados visiblemente en góndola / Total SKUs del planograma)] × 100</p>
      <div id="kpiTiles" class="grid2" style="margin-top:10px;"></div>
      <div style="margin-top:18px;"><canvas id="chartOSA"></canvas></div>
      <div id="tablaKPI" style="margin-top:16px; overflow-x:auto;"></div>
    </div>
  `;
  cargarKPI();
}

function cargarKPI(){
  const tienda = document.getElementById('filtroTiendaKPI').value;
  callApi('getKPI', { filtros: { tienda: tienda } })
    .then(d => {
      const det = d.detalle;
      const tiles = document.getElementById('kpiTiles');
      if(det.length === 0){
        tiles.innerHTML = '<div class="muted">Aún no hay suficientes datos registrados para calcular el OSA.</div>';
      } else {
        const ultimo = det[det.length - 1];
        tiles.innerHTML = `
          <div class="kpi-tile"><div class="val">${ultimo.osa !== null ? ultimo.osa + '%' : '—'}</div><div class="lbl">OSA · ${ultimo.tienda} · ${ultimo.mes}</div></div>
          <div class="kpi-tile" style="background:linear-gradient(135deg,#c8382a,#9c2a20);"><div class="val">${ultimo.skusAgotados}</div><div class="lbl">SKUs agotados (${ultimo.mes})</div></div>
        `;
      }
      if(!d.inventarioTieneTiendaDiligenciada){
        tiles.innerHTML += '<div class="muted" style="grid-column:1/-1;">Nota: la hoja Inventario_Base no tiene la columna Tienda_PDV diligenciada, así que el total de SKUs del planograma se calculó sobre el inventario general, no por tienda.</div>';
      }

      if(state.charts.osa) state.charts.osa.destroy();
      const ctx = document.getElementById('chartOSA');
      const porMes = {};
      det.forEach(r => { (porMes[r.tienda] = porMes[r.tienda] || []).push(r); });
      const meses = Array.from(new Set(det.map(r=>r.mes))).sort();
      const datasets = Object.keys(porMes).map((t,i) => ({
        label: t,
        data: meses.map(m => { const f = porMes[t].find(x=>x.mes===m); return f ? f.osa : null; }),
        borderColor: PALETA[i % PALETA.length], backgroundColor: PALETA[i % PALETA.length], tension:.25, spanGaps:true
      }));
      state.charts.osa = new Chart(ctx, {
        type: 'line',
        data: { labels: meses, datasets },
        options: { scales: { y: { min:0, max:100, ticks:{ callback:v=>v+'%' } } }, plugins:{ legend:{ position:'bottom' } } }
      });

      document.getElementById('tablaKPI').innerHTML = det.length ? `
        <table><thead><tr><th>Tienda</th><th>Mes</th><th>SKUs agotados</th><th>Total SKUs planograma</th><th>OSA</th></tr></thead>
        <tbody>${det.map(r=>`<tr><td>${r.tienda}</td><td>${r.mes}</td><td>${r.skusAgotados}</td><td>${r.totalSkusPlanograma}</td><td><strong>${r.osa!==null?r.osa+'%':'—'}</strong></td></tr>`).join('')}</tbody></table>
      ` : '';
    })
    .catch(err => toast('Error KPI: ' + err.message, true));
}

window.addEventListener('load', checkSesionPrevia);
